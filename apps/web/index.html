<!DOCTYPE html>
<html class="light" data-theme="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Anti-FOUC: apply persisted theme before React hydrates -->
    <script>
      (() => {
        try {
          const t = localStorage.getItem('jungleVPN-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.className = t;
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/src/assets/fonts/MartianMono-StdRg.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "MartianMono";
        src: url("/src/assets/fonts/MartianMono-StdRg.woff2") format("woff2"),
             url("/src/assets/fonts/MartianMono-StdRg.ttf") format("ttf"),
             url("/src/assets/fonts/MartianMono-StdRg.otf") format("otf");
        font-weight: normal;
        font-style: normal;
        font-display: optional;
      }
    </style>
    <script>
      if ('%PUBLIC_GA_ENABLED%' !== 'false') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-6L3FCNC1NF';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-6L3FCNC1NF');
      }
    </script>


  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
