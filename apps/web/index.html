<!DOCTYPE html>
<html class="light" data-theme="light" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Anti-FOUC: apply persisted theme before React hydrates -->
    <script>
      (() => {
        try {
          const t = localStorage.getItem('jungleVPN-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.className = t;
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JungleVPN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      if ('%PUBLIC_GA_ENABLED%' !== 'false') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-6L3FCNC1NF';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-6L3FCNC1NF');
      }
    </script>

    <!-- Tolt affiliate/referral tracking -->
    <script async src="https://files.tlt-cdn.com/tlt.js"
            data-tolt="%PUBLIC_TOLT_ID%"></script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
