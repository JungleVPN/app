<!DOCTYPE html>
<html class="light" data-theme="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Anti-FOUC: apply persisted theme before React hydrates -->
    <script>
      (() => {
        try {
          const t = localStorage.getItem('jungleVPN-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.className = t;
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/src/assets/fonts/MartianMono-StdRg.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "MartianMono";
        src: url("/src/assets/fonts/MartianMono-StdRg.woff2") format("woff2"),
             url("/src/assets/fonts/MartianMono-StdRg.ttf") format("ttf"),
             url("/src/assets/fonts/MartianMono-StdRg.otf") format("otf");
        font-weight: normal;
        font-style: normal;
        font-display: optional;
      }
    </style>
    <script>
      if ('%PUBLIC_GA_ENABLED%' !== 'false') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-6L3FCNC1NF';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-6L3FCNC1NF');
      }
    </script>

    <meta name="google-site-verification" content="Tth6c3fgzSXFLQHz2UJMhfsnr1yulyUhOLOMc50ULuI" />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-pointer-->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
