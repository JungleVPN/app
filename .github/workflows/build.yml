name: Build & Deploy

on:
  push:
    branches: [main, CI-CD]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/junglevpn/app

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # BUILD_ENV secret holds the .env file content needed at build time
      # (VITE_ variables that get baked into the frontend bundle).
      # Add it in: Settings → Secrets → Actions → New repository secret
      - name: Write build-time .env
        run: printf '%s' "${{ secrets.BUILD_ENV }}" > /tmp/build.env

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            env=/tmp/build.env
          # GitHub Actions cache — dramatically speeds up repeat builds
          # by reusing unchanged Dockerfile layers across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TURBO_CONCURRENCY=4

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    environment: production
    # Only deploy on pushes to main (not on manual workflow_dispatch from other branches)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d
            docker image prune -f
