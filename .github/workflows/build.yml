name: Build & Deploy

on:
  push:
    branches: [main, stage]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/junglevpn/app

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        run: |
          git init
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Set up Docker Buildx
        run: docker buildx create --use --name builder --driver docker-container

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Write build-time .env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/stage" ]; then
            cp staging.build.env /tmp/build.env
          else
            cp prod.build.env /tmp/build.env
          fi

      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref }}" = "refs/heads/stage" ]; then
            LATEST_TAG="${{ env.IMAGE }}:stage-latest"
            SHA_TAG="${{ env.IMAGE }}:stage-sha-${SHORT_SHA}"
          else
            LATEST_TAG="${{ env.IMAGE }}:latest"
            SHA_TAG="${{ env.IMAGE }}:sha-${SHORT_SHA}"
          fi
          docker buildx build \
            --push \
            --tag "${SHA_TAG}" \
            --tag "${LATEST_TAG}" \
            --secret id=env,src=/tmp/build.env \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg TURBO_CONCURRENCY=7 \
            .

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    # DEPLOY_* are production's. Staging has its own STAGING_DEPLOY_* set below —
    # do not reuse these there, or a stage push lands on this host.
    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && docker compose pull && docker compose up -d && docker image prune -f && docker compose ps"
          rm -f /tmp/deploy_key

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/stage'

    steps:
      # The staging host must be addressed by its own secrets. Sharing DEPLOY_*
      # with the production job means `if:` only picks which job runs, never
      # where it lands — a push to stage then deploys onto production, reads
      # production's compose file, and pulls :latest instead of :stage-latest.
      #
      # No fallback to the production secrets on purpose: an unset value must
      # stop the deploy, not quietly redirect it.
      - name: Require staging deploy targets
        env:
          HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          USER: ${{ secrets.STAGING_DEPLOY_USER }}
          PATH_: ${{ secrets.STAGING_DEPLOY_PATH }}
          PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
          KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ]  || missing="$missing STAGING_DEPLOY_HOST"
          [ -n "$USER" ]  || missing="$missing STAGING_DEPLOY_USER"
          [ -n "$PATH_" ] || missing="$missing STAGING_DEPLOY_PATH"
          [ -n "$PORT" ]  || missing="$missing STAGING_DEPLOY_PORT"
          [ -n "$KEY" ]   || missing="$missing STAGING_DEPLOY_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing staging secrets:$missing — refusing to deploy in case it lands on production."
            exit 1
          fi

      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DIR: ${{ secrets.STAGING_DEPLOY_PATH }}
          PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
        run: |
          echo "STAGING_DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -p "$PORT" "$USER@$HOST" \
            "cd '$DIR' && docker compose pull && docker compose up -d && docker image prune -f && docker compose ps"
          rm -f /tmp/deploy_key

      # COMPOSE_FILE=compose.staging.yml in the deploy directory's .env is what
      # selects the staging stack, and nothing upstream verifies it is still
      # there. Assert on the result instead — a deploy that silently resolved to
      # the production image should fail the run, not look green.
      - name: Verify the staging stack was the one deployed
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DIR: ${{ secrets.STAGING_DEPLOY_PATH }}
          PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          echo "STAGING_DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          images=$(ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -p "$PORT" "$USER@$HOST" \
            "cd '$DIR' && docker compose config --images")
          rm -f /tmp/deploy_key
          echo "$images"
          if echo "$images" | grep -qx "$IMAGE:latest"; then
            echo "::error::Staging resolved to the production image. Check COMPOSE_FILE in $DIR/.env."
            exit 1
          fi
          echo "$images" | grep -qx "$IMAGE:stage-latest" \
            || { echo "::error::Expected $IMAGE:stage-latest among the resolved images."; exit 1; }
