name: Build & Deploy

on:
  push:
    branches: [main, stage, CI-CD]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/junglevpn/app

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        run: |
          git init
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Set up Docker Buildx
        run: docker buildx create --use --name builder --driver docker-container

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Write build-time .env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/stage" ]; then
            printf '%s' "${{ secrets.STAGING_BUILD_ENV }}" > /tmp/build.env
          else
            printf '%s' "${{ secrets.BUILD_ENV }}" > /tmp/build.env
          fi

      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref }}" = "refs/heads/stage" ]; then
            LATEST_TAG="${{ env.IMAGE }}:stage-latest"
            SHA_TAG="${{ env.IMAGE }}:stage-sha-${SHORT_SHA}"
          else
            LATEST_TAG="${{ env.IMAGE }}:latest"
            SHA_TAG="${{ env.IMAGE }}:sha-${SHORT_SHA}"
          fi
          docker buildx build \
            --push \
            --tag "${SHA_TAG}" \
            --tag "${LATEST_TAG}" \
            --secret id=env,src=/tmp/build.env \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg TURBO_CONCURRENCY=4 \
            .

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && docker compose pull && docker compose up -d && docker image prune -f && docker compose ps"
          rm -f /tmp/deploy_key

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/stage'

    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.STAGING_DEPLOY_PATH }} && docker compose -f compose.staging.yml pull && docker compose -f compose.staging.yml up -d && docker image prune -f && docker compose -f compose.staging.yml ps"
          rm -f /tmp/deploy_key
