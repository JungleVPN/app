name: Build & Deploy

on:
  push:
    branches: [main, CI-CD]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/junglevpn/app

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        run: |
          git init
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Set up Docker Buildx
        run: docker buildx create --use --name builder --driver docker-container

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Write build-time .env
        run: printf '%s' "${{ secrets.BUILD_ENV }}" > /tmp/build.env

      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker buildx build \
            --push \
            --tag "${{ env.IMAGE }}:sha-${SHORT_SHA}" \
            --tag "${{ env.IMAGE }}:latest" \
            --secret id=env,src=/tmp/build.env \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg TURBO_CONCURRENCY=4 \
            .

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && docker compose -f compose.prod.yml pull && docker compose -f compose.prod.yml up -d && docker image prune -f"
          rm -f /tmp/deploy_key
