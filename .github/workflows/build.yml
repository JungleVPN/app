name: Build & Deploy

on:
  push:
    branches: [main, stage]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/junglevpn/app

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        run: |
          git init
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Set up Docker Buildx
        run: docker buildx create --use --name builder --driver docker-container

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # The target server's .env files are the single source of truth for the
      # build too — Vite bundles only their PUBLIC_*/VITE_* vars. Each branch
      # reads its own host's secrets with no fallback, so a stage build can
      # never pick up production's env (or the other way round).
      - name: Fetch env files from the target server
        env:
          IS_STAGE: ${{ github.ref == 'refs/heads/stage' }}
          STAGING_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DIR: ${{ secrets.STAGING_DEPLOY_PATH }}
          STAGING_PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
          PROD_KEY: ${{ secrets.DEPLOY_KEY }}
          PROD_HOST: ${{ secrets.DEPLOY_HOST }}
          PROD_USER: ${{ secrets.DEPLOY_USER }}
          PROD_DIR: ${{ secrets.DEPLOY_PATH }}
          PROD_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          if [ "$IS_STAGE" = "true" ]; then
            KEY="$STAGING_KEY" HOST="$STAGING_HOST" USER="$STAGING_USER" DIR="$STAGING_DIR" PORT="$STAGING_PORT"
          else
            KEY="$PROD_KEY" HOST="$PROD_HOST" USER="$PROD_USER" DIR="$PROD_DIR" PORT="$PROD_PORT"
          fi
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$DIR" ] || [ -z "$PORT" ]; then
            echo "::error::Missing deploy secrets for this branch's server — cannot fetch its env files."
            exit 1
          fi

          ENV_DIR="$RUNNER_TEMP/build-env"
          mkdir -p "$ENV_DIR" && chmod 700 "$ENV_DIR"
          echo "$KEY" > "$RUNNER_TEMP/deploy_key" && chmod 600 "$RUNNER_TEMP/deploy_key"
          for f in .env .env.public .env.payments .env.secrets; do
            scp -q -i "$RUNNER_TEMP/deploy_key" \
              -o StrictHostKeyChecking=no \
              -P "$PORT" "$USER@$HOST:$DIR/$f" "$ENV_DIR/$f" \
              || { rm -f "$RUNNER_TEMP/deploy_key"; echo "::error::Could not fetch $f from $DIR on the server."; exit 1; }
          done
          rm -f "$RUNNER_TEMP/deploy_key"
          chmod 600 "$ENV_DIR"/.env*

          # BuildKit leaves secret contents out of its cache keys. Hash the
          # public vars so changing one on the server rebuilds the frontends.
          echo "PUBLIC_ENV_HASH=$(cat "$ENV_DIR"/.env* | grep -E '^(PUBLIC_|VITE_)' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
          echo "ENV_DIR=$ENV_DIR" >> "$GITHUB_ENV"

      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref }}" = "refs/heads/stage" ]; then
            LATEST_TAG="${{ env.IMAGE }}:stage-latest"
            SHA_TAG="${{ env.IMAGE }}:stage-sha-${SHORT_SHA}"
          else
            LATEST_TAG="${{ env.IMAGE }}:latest"
            SHA_TAG="${{ env.IMAGE }}:sha-${SHORT_SHA}"
          fi
          docker buildx build \
            --push \
            --tag "${SHA_TAG}" \
            --tag "${LATEST_TAG}" \
            --secret id=env,src="$ENV_DIR/.env" \
            --secret id=env_public,src="$ENV_DIR/.env.public" \
            --secret id=env_payments,src="$ENV_DIR/.env.payments" \
            --secret id=env_secrets,src="$ENV_DIR/.env.secrets" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg TURBO_CONCURRENCY=7 \
            --build-arg PUBLIC_ENV_HASH="$PUBLIC_ENV_HASH" \
            .

      - name: Remove fetched env files
        if: always()
        run: rm -rf "$RUNNER_TEMP/build-env"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED != 'false'

    # DEPLOY_* are production's. Staging has its own STAGING_DEPLOY_* set below —
    # do not reuse these there, or a stage push lands on this host.
    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && docker compose pull && docker compose up -d && docker image prune -f && docker compose ps"
          rm -f /tmp/deploy_key

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/stage'

    steps:
      # The staging host must be addressed by its own secrets. Sharing DEPLOY_*
      # with the production job means `if:` only picks which job runs, never
      # where it lands — a push to stage then deploys onto production, reads
      # production's compose file, and pulls :latest instead of :stage-latest.
      #
      # No fallback to the production secrets on purpose: an unset value must
      # stop the deploy, not quietly redirect it.
      - name: Require staging deploy targets
        env:
          HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          USER: ${{ secrets.STAGING_DEPLOY_USER }}
          PATH_: ${{ secrets.STAGING_DEPLOY_PATH }}
          PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
          KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ]  || missing="$missing STAGING_DEPLOY_HOST"
          [ -n "$USER" ]  || missing="$missing STAGING_DEPLOY_USER"
          [ -n "$PATH_" ] || missing="$missing STAGING_DEPLOY_PATH"
          [ -n "$PORT" ]  || missing="$missing STAGING_DEPLOY_PORT"
          [ -n "$KEY" ]   || missing="$missing STAGING_DEPLOY_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing staging secrets:$missing — refusing to deploy in case it lands on production."
            exit 1
          fi

      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DIR: ${{ secrets.STAGING_DEPLOY_PATH }}
          PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -p "$PORT" "$USER@$HOST" \
              "cd '$DIR' \
              && docker compose -f compose.staging.yml pull \
              && docker compose -f compose.staging.yml up -d \
              && docker image prune -f \
              && docker compose -f compose.staging.yml ps"
          rm -f /tmp/deploy_key

      # Staging and production share a host, so -f above is the only thing
      # separating the two stacks. Assert on the outcome as well: a deploy that
      # resolved to the production image must fail the run, not look green.
      - name: Verify the staging stack was the one deployed
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DIR: ${{ secrets.STAGING_DEPLOY_PATH }}
          PORT: ${{ secrets.STAGING_DEPLOY_PORT }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          images=$(ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -p "$PORT" "$USER@$HOST" \
            "cd '$DIR' && docker compose -f compose.staging.yml config --images")
          rm -f /tmp/deploy_key
          echo "$images"
          if echo "$images" | grep -qx "$IMAGE:latest"; then
            echo "::error::Staging resolved to the production image. Check COMPOSE_FILE in $DIR/.env."
            exit 1
          fi
          echo "$images" | grep -qx "$IMAGE:stage-latest" \
            || { echo "::error::Expected $IMAGE:stage-latest among the resolved images."; exit 1; }
